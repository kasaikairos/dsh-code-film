<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Poster</title>
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  #stage{position:relative;width:1920px;height:1080px}
  canvas{position:absolute;inset:0;display:block}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<script type="module">
/* scene_poster.html —— 纯平面设计（无贴图、无颗粒）
   构成：色块背景 + 几何图形 + 层级排版 + 简洁动效。
   spec.poster: { align, shapes:[circle|bar|rule|dots|arc], grid:true } */
const S = Object.assign({
  duration: 8, bpm: 60, seed: 7,
  palette: ["#f2ede3", "#141110", "#b8452e", "#2b2b2b", "#d9cfc0"],
  type: { title: "", sub: "", kicker: "", size: 168 },
  poster: { align: "left", shapes: ["circle", "bar"], gradient: true },
}, window.SCENE_SPEC || {});
const W = 1920, H = 1080;
window.FILM = { width: W, height: H, fps: 30, duration: S.duration };

const cv = document.getElementById("c");
const dpr = window.devicePixelRatio || 1;
cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
cv.style.width = W + "px"; cv.style.height = H + "px";
const g = cv.getContext("2d");
g.scale(cv.width / W, cv.height / H);
window.filmCanvas = cv; window.filmCanvasOnly = true;
const P = S.poster || {};
const PAL = S.palette || [];
const PAPER = PAL[0], INK = PAL[1], ACC = PAL[2];
const M = Math.round(W * 0.082);           // 外边距
const FS = S.type.size || 168;
const SHAPES = P.shapes || [];

function hex2rgb(h) { h = (h || "#ffffff").replace("#", ""); return [parseInt(h.slice(0,2),16) || 0, parseInt(h.slice(2,4),16) || 0, parseInt(h.slice(4,6),16) || 0]; }
function mix(a, b, t) {
  const A = hex2rgb(a), B = hex2rgb(b);
  return `rgb(${Math.round(A[0]+(B[0]-A[0])*t)},${Math.round(A[1]+(B[1]-A[1])*t)},${Math.round(A[2]+(B[2]-A[2])*t)})`;
}
function rgba(h, a) { const c = hex2rgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

/* 标题分两行：过长时按标点/字数切 */
function splitTitle(t) {
  if (!t) return [""];
  if (t.includes("\n")) return t.split("\n");
  const maxChars = 7;
  if (t.length <= maxChars) return [t];
  const marks = ["，", "。", "、", "；", " ", "·"];
  for (const mk of marks) {
    const i = t.indexOf(mk);
    if (i > 0 && i < t.length - 1) return [t.slice(0, i), t.slice(i + 1)];
  }
  const mid = Math.ceil(t.length / 2);
  return [t.slice(0, mid), t.slice(mid)];
}

function renderFrame(t) {
  const enter = Math.min(1, Math.max(0, t / 0.45));
  const e = 1 - Math.pow(1 - enter, 3);

  /* 背景：纯色 +（可选）同色系径向渐变，不是贴图 */
  g.fillStyle = PAPER;
  g.fillRect(0, 0, W, H);
  if (P.gradient !== false) {
    const rg = g.createRadialGradient(W * 0.34, H * 0.30, H * 0.05, W * 0.45, H * 0.5, H * 1.15);
    rg.addColorStop(0, mix(PAPER, "#ffffff", 0.16));
    rg.addColorStop(1, mix(PAPER, "#000000", 0.10));
    g.fillStyle = rg;
    g.fillRect(0, 0, W, H);
  }

  /* 几何 */
  const centerAlign = (P.align === "center");
  const cx = centerAlign ? W * 0.5 : W * 0.775, cy = H * 0.315, R = H * 0.205;
  if (SHAPES.includes("circle")) {
    g.save();
    g.globalAlpha = 0.06; g.fillStyle = ACC;
    g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();
    g.globalAlpha = 0.9; g.strokeStyle = ACC; g.lineWidth = 2;
    g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.stroke();
    g.restore();
  }
  if (SHAPES.includes("bar")) {
    g.fillStyle = ACC; g.fillRect(W * 0.795, H * 0.565, 8, H * 0.17);
  }
  if (SHAPES.includes("rule")) {
    g.fillStyle = INK; g.globalAlpha = 0.38;
    g.fillRect(M, H * 0.148, W * 0.19, 1);
    g.globalAlpha = 1;
  }
  if (SHAPES.includes("dots")) {   // 点阵：矢量圆点，不是贴图
    g.fillStyle = INK; g.globalAlpha = 0.12;
    for (let i = 0; i < 6; i++) for (let j = 0; j < 6; j++) {
      g.beginPath(); g.arc(W * 0.80 + i * 26, H * 0.78 + j * 26, 2.4, 0, Math.PI * 2); g.fill();
    }
    g.globalAlpha = 1;
  }

  /* 页眉 */
  if (S.type.kicker) {
    g.fillStyle = ACC;
    g.font = `500 ${Math.round(FS * 0.115)}px ui-monospace, Menlo, Consolas, monospace`;
    if ("letterSpacing" in g) g.letterSpacing = `${Math.round(FS * 0.04)}px`;
    g.fillText(S.type.kicker, M, H * 0.113);
    if ("letterSpacing" in g) g.letterSpacing = "0px";
  }

  /* 主标题：自动适配 + 最多两行 */
  const lines = splitTitle(S.type.title || "");
  let fs = FS;
  const setFont = (size) => {
    g.font = `700 ${size}px "Source Han Serif SC","Noto Serif CJK SC","Songti SC",serif`;
    if ("letterSpacing" in g) g.letterSpacing = `${Math.round(size * 0.03)}px`;
  };
  const maxW = W * (centerAlign ? 0.84 : 0.62);
  setFont(fs);
  const widest = () => Math.max(...lines.map((l) => g.measureText(l).width));
  while (widest() > maxW && fs > 44) { fs -= 4; setFont(fs); }
  const lh = fs * 1.12;
  const blockH = lh * lines.length;
  const baseY = (centerAlign ? H * 0.50 : H * 0.545) + fs * 0.30 - (blockH - lh) / 2;

  g.fillStyle = INK;
  g.globalAlpha = 0.10 + 0.90 * e;
  lines.forEach((ln, i) => {
    const lw = g.measureText(ln).width;
    const x = centerAlign ? (W - lw) / 2 : M;
    g.fillText(ln, x, baseY + i * lh - (1 - e) * 14);
  });
  g.globalAlpha = 1;
  if ("letterSpacing" in g) g.letterSpacing = "0px";

  /* 副标题：拉字距的小字 */
  if (S.type.sub) {
    const sfs = Math.round(FS * 0.115);
    g.font = `500 ${sfs}px ui-sans-serif, Helvetica, Arial, sans-serif`;
    const sp = Math.round(sfs * 0.36);
    const chars = S.type.sub.split("");
    let total = 0;
    for (const ch of chars) total += g.measureText(ch).width + sp;
    let x = centerAlign ? (W - total) / 2 : M;
    const y = baseY + (lines.length - 1) * lh + sfs * 2.0;
    g.globalAlpha = 0.66;
    for (const ch of chars) { g.fillText(ch, x, y); x += g.measureText(ch).width + sp; }
    g.globalAlpha = 1;
  }

  /* 页脚 */
  if (S.type.footer) {
    g.font = `${Math.round(FS * 0.092)}px ui-monospace, Menlo, Consolas, monospace`;
    g.globalAlpha = 0.42;
    g.fillStyle = INK;
    g.fillText(S.type.footer, M, H - H * 0.082);
    g.globalAlpha = 1;
  }
}

window.renderFrame = renderFrame;
renderFrame(0);
window.__READY = true;
</script>
</body>
</html>
