<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>space kit</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
<script type="importmap">{ "imports": { "three": "./vendor/three/build/three.module.js" } }</script>
</head><body><canvas id="gl"></canvas>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from './vendor/three/RoundedBoxGeometry.js';

/* =====================================================================
   kit_space —— 空间与材质（声明式场景）
   画面 = 前景 / 中景 / 背景 三层 + 接地阴影 + 湿地反光 + 大气
   约定：window.SPACE_SPEC 由 space.py 注入；window.renderFrame(t) 纯函数。
   ===================================================================== */

const DEF = {
  duration: 6, fps: 24, seed: 7,
  camera: { mode: 'orbit', az: 38, el: 17, dist: 15, fov: 34, target: [0, 1.1, 0],
            azDrift: 7, distDrift: 0.0, rise: 0.0, focus: 15, aperture: 0.55 },
  lights: [
    { kind: 'ambient', color: '#41506b', intensity: 0.55 },
    { kind: 'dir', dir: [-0.35, -1, -0.45], color: '#cfe0ff', intensity: 0.85, shadow: true },
  ],
  ground: { y: 0, size: 46, kind: 'wet_asphalt', tint: '#0b0e14', rough: 0.34,
            reflectivity: 0.62, puddle: 0.45, ripple: 0.5, sheen: 0.35 },
  atmosphere: { fog: { color: '#101724', density: 0.032 }, haze: 0.0,
                rain: { count: 0, speed: 9, slant: 0.16, width: 0.016, color: '#b9cdf0', opacity: 0.5, area: [26, 14, 26] } },
  post: { exposure: 1.12, bloom: 0.30, bloomThresh: 0.72, grain: 0, vignette: 0.34,
          ca: 0.0007, sat: 1.06, contrast: 1.04, dof: 0.55, dofMax: 0.012 },
  background: null,
};

function merge(base, over) {
  if (Array.isArray(base) || Array.isArray(over)) return over === undefined ? base : over;
  if (typeof base !== 'object' || base === null) return over === undefined ? base : over;
  if (typeof over !== 'object' || over === null) return base;
  const out = { ...base };
  for (const k of Object.keys(over)) out[k] = merge(base[k], over[k]);
  return out;
}
const S = merge(DEF, window.SPACE_SPEC || {});

/* ---------- 确定性随机 + 噪声 ---------- */
function mulberry(seed) {
  let a = (Number(seed) || 1) >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const RND = mulberry(S.seed);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const D2R = Math.PI / 180;
const col = (c, i) => {
  if (Array.isArray(c)) c = c[clamp(i | 0, 0, c.length - 1)];
  return new THREE.Color(c);
};
function hsl2hex(h, s, l) { const c = new THREE.Color(); c.setHSL(h, s, l); return '#' + c.getHexString(); }

/* ---------- 画布纹理（初始化一次） ---------- */
const TEX = {};
function canvasTex(w, h, draw, { repeat = [1, 1], srgb = true, aniso = 4 } = {}) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat[0], repeat[1]);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.anisotropy = aniso; t.needsUpdate = true;
  return t;
}
function noiseFill(g, w, h, base, amp, scale, seed) {
  const r = mulberry(seed);
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) {
    const x = r() * w, y = r() * h, s = 1 + r() * scale;
    const a = (r() - 0.5) * amp;
    g.fillStyle = `rgba(${a > 0 ? 255 : 0},${a > 0 ? 255 : 0},${a > 0 ? 255 : 0},${Math.abs(a)})`;
    g.fillRect(x, y, s, s);
  }
}
function makeTextures() {
  const sample = mulberry((S.seed ?? 7) + 811);
  TEX.plaster = canvasTex(256, 256, (g, w, h) => {
    noiseFill(g, w, h, '#cfc8ba', 0.10, 3, 3);
    g.globalAlpha = 0.10;
    for (let y = 0; y < h; y += 32) { g.fillStyle = '#000'; g.fillRect(0, y, w, 1); }
    g.globalAlpha = 1;
  }, { repeat: [2, 2] });
  TEX.concrete = canvasTex(256, 256, (g, w, h) => noiseFill(g, w, h, '#6d6f74', 0.16, 4, 9), { repeat: [3, 3] });
  TEX.asphalt = canvasTex(256, 256, (g, w, h) => {
    noiseFill(g, w, h, '#23262c', 0.22, 3, 13);
    g.globalAlpha = 0.18;
    for (let i = 0; i < 90; i++) {
      const x = sample() * w, y = sample() * h;
      g.fillStyle = '#8b8f96'; g.beginPath(); g.arc(x, y, 0.6 + sample(), 0, 7); g.fill();
    }
    g.globalAlpha = 1;
  }, { repeat: [6, 6] });
  TEX.tile = canvasTex(256, 256, (g, w, h) => {
    noiseFill(g, w, h, '#b9b3a6', 0.06, 2, 21);
    g.strokeStyle = 'rgba(60,55,48,.35)'; g.lineWidth = 2;
    for (let i = 0; i <= 4; i++) {
      g.beginPath(); g.moveTo(i * w / 4, 0); g.lineTo(i * w / 4, h); g.stroke();
      g.beginPath(); g.moveTo(0, i * h / 4); g.lineTo(w, i * h / 4); g.stroke();
    }
  }, { repeat: [4, 4] });
  TEX.brick = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#4a4038'; g.fillRect(0, 0, w, h);
    const bh = 32, bw = 64;
    for (let r = 0; r < h / bh; r++) {
      for (let c = -1; c < w / bw + 1; c++) {
        const off = (r % 2) * bw / 2;
        g.fillStyle = hsl2hex(0.06 + sample() * 0.02, 0.28, 0.30 + sample() * 0.07);
        g.fillRect(c * bw + off + 2, r * bh + 2, bw - 4, bh - 4);
      }
    }
  }, { repeat: [3, 2] });
  TEX.wood = canvasTex(256, 256, (g, w, h) => {
    noiseFill(g, w, h, '#6b4c33', 0.12, 5, 33);
    g.globalAlpha = 0.25; g.strokeStyle = '#2e1f14'; g.lineWidth = 1;
    for (let i = 0; i < 26; i++) { const y = sample() * h;
      g.beginPath(); g.moveTo(0, y); g.bezierCurveTo(w * .3, y + 6, w * .7, y - 6, w, y + 2); g.stroke(); }
    g.globalAlpha = 1;
  }, { repeat: [2, 2] });
  TEX.metal = canvasTex(128, 128, (g, w, h) => {
    noiseFill(g, w, h, '#8d939c', 0.18, 2, 44);
  }, { repeat: [1, 1] });
  TEX.stripes = canvasTex(128, 128, (g, w, h) => {
    for (let i = 0; i < 8; i++) {
      g.fillStyle = i % 2 ? '#e8e2d4' : '#b4402f';
      g.fillRect(0, i * h / 8, w, h / 8);
    }
  }, { repeat: [1, 1] });
  // 运动物体的实时接触阴影：一张软圆斑，跟着物体走
  TEX.contact = canvasTex(128, 128, (g, w, h) => {
    const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    gr.addColorStop(0, 'rgba(0,0,0,0.95)');
    gr.addColorStop(0.45, 'rgba(0,0,0,0.55)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  }, { repeat: [1, 1], srgb: false });
}

/* ---------- 渲染器 / 场景 ---------- */
const cv = document.getElementById('gl');
const [W, H] = window.SPACE_RENDER_SIZE || [1920, 1080];                       // 逻辑画布固定：渲染期间不改尺寸（改尺寸会清空画布）
cv.width = W; cv.height = H;
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: false,
  preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;      // 色调映射在后期做（ACES）
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.localClippingEnabled = true;
makeTextures();

const scene = new THREE.Scene();
// Static reflection cards are specified in lighting space (directions relative to the subject).
// They stay off camera and are filtered once for glossy and rough materials.
if (S.environment?.cards?.length) {
  const rig = new THREE.Scene();
  rig.background = new THREE.Color(S.environment.fill || '#15181b');
  for (const card of S.environment.cards) {
    const panel = new THREE.Mesh(new THREE.PlaneGeometry(...card.size),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(card.color || '#ffffff')
        .multiplyScalar(card.intensity ?? 1), side: THREE.DoubleSide }));
    panel.position.fromArray(card.pos);
    panel.lookAt(0, 0, 0);
    rig.add(panel);
  }
  const generator = new THREE.PMREMGenerator(renderer);
  scene.environment = generator.fromScene(rig, 0, 0.01, 100, { size: 128 }).texture;
  scene.environmentIntensity = S.environment.intensity ?? 1;
  generator.dispose();
  for (const panel of rig.children) { panel.geometry.dispose(); panel.material.dispose(); }
}
const camera = new THREE.PerspectiveCamera(S.camera.fov, W / H, 0.1, 220);
const mirrorCam = camera.clone();

/* 背景穹顶：渐变 + 地平线雾色，避免"黑底" */
let bgMesh = null;
function buildBackground() {
  if (bgMesh) { scene.remove(bgMesh); bgMesh.geometry.dispose(); bgMesh.material.dispose(); }
  const b = S.background || {};
  const top = new THREE.Color(b.top || '#182236');
  const hor = new THREE.Color(b.horizon || '#2b3550');
  const bot = new THREE.Color(b.bottom || b.horizon || '#0d1018');
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { uTop: { value: top }, uHor: { value: hor }, uBot: { value: bot },
                uGlow: { value: b.glow || 0 }, uGlowColor: { value: new THREE.Color(b.glowColor || '#ffb066') },
                uGlowPos: { value: new THREE.Vector3(...(b.glowPos || [0.25, 0.1, -0.9])).normalize() } },
    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); vec4 clip = projectionMatrix * vec4(mat3(viewMatrix) * position, 1.0); gl_Position = clip.xyww; }`,
    fragmentShader: `
      varying vec3 vDir; uniform vec3 uTop,uHor,uBot,uGlowColor,uGlowPos; uniform float uGlow;
      void main(){
        float y = vDir.y;
        vec3 c = y > 0.0 ? mix(uHor, uTop, pow(clamp(y,0.0,1.0), 0.65))
                         : mix(uHor, uBot, pow(clamp(-y,0.0,1.0), 0.5));
        float g = pow(max(dot(normalize(vDir), uGlowPos), 0.0), 6.0);
        c += uGlowColor * g * uGlow;
        gl_FragColor = vec4(c, 1.0);
      }`,
  });
  bgMesh = new THREE.Mesh(new THREE.SphereGeometry(120, 32, 16), mat);
  bgMesh.frustumCulled = false;
  bgMesh.renderOrder = -1000;
  scene.add(bgMesh);
}
buildBackground();

/* 雾 */
if (S.atmosphere.fog && S.atmosphere.fog.density) {
  scene.fog = new THREE.FogExp2(new THREE.Color(S.atmosphere.fog.color).getHex(),
    S.atmosphere.fog.density);
}

/* ---------- 灯光 ---------- */
const lights = [];
function buildLights() {
  lights.forEach(l => { if (l.light && l.light.dispose) l.light.dispose(); });
  lights.length = 0;
  for (const spec of S.lights) {
    const c = col(spec.color || '#ffffff');
    let l = null;
    if (spec.kind === 'ambient') {
      l = new THREE.AmbientLight(c, spec.intensity ?? 0.4);
    } else if (spec.kind === 'hemi') {
      l = new THREE.HemisphereLight(c, col(spec.groundColor || '#20242e'), spec.intensity ?? 0.4);
    } else if (spec.kind === 'dir') {
      l = new THREE.DirectionalLight(c, spec.intensity ?? 1);
      const d = new THREE.Vector3(...(spec.dir || [0, -1, 0])).normalize();
      l.position.copy(d.clone().multiplyScalar(-18));
      l.target.position.set(0, 0, 0); scene.add(l.target);
      if (spec.shadow !== false) {
        l.castShadow = true;
        const sc = l.shadow.camera;
        const span = Number.isFinite(spec.shadowSpan) && spec.shadowSpan > 0 ? spec.shadowSpan : 32;
        if (Array.isArray(spec.shadowCenter)) {
          l.target.position.fromArray(spec.shadowCenter);
          l.position.add(l.target.position);
        }
        sc.left = sc.bottom = -span / 2; sc.right = sc.top = span / 2; sc.near = 1; sc.far = 60;
        l.shadow.mapSize.set(2048, 2048);
        l.shadow.bias = S.ground.physicalLighting ? -Math.min(0.0009, span / 65000) : -0.0009;
        l.shadow.normalBias = Math.min(0.02, span / 1600);
      }
    } else if (spec.kind === 'point') {
      l = new THREE.PointLight(c, spec.intensity ?? 8, spec.dist ?? 0, spec.decay ?? 2);
      l.position.set(...(spec.pos || [0, 3, 0]));
      if (spec.shadow) {
        l.castShadow = true; l.shadow.mapSize.set(1024, 1024);
        l.shadow.bias = -0.004; l.shadow.normalBias = 0.03;
      }
    } else if (spec.kind === 'spot') {
      l = new THREE.SpotLight(c, spec.intensity ?? 20, spec.dist ?? 0, (spec.angle ?? 40) * D2R,
        spec.penumbra ?? 0.5, spec.decay ?? 2);
      l.position.set(...(spec.pos || [0, 6, 0]));
      l.target.position.set(...(spec.target || [0, 0, 0]));
      scene.add(l.target);
      if (spec.shadow) {
        l.castShadow = true; l.shadow.mapSize.set(1024, 1024);
        l.shadow.bias = -0.002; l.shadow.normalBias = 0.02;
        l.shadow.camera.near = 0.5; l.shadow.camera.far = 40;
      }
    }
    if (!l) continue;
    l.userData.spec = spec;
    scene.add(l);
    lights.push({ spec, light: l });
  }
}
buildLights();

/* ---------- 材质 ---------- */
function material(spec, seedIdx) {
  const m = spec || {};
  const base = col(m.albedo ?? m.color ?? '#b9b3a6', seedIdx || 0);
  const texName = m.tex || null;
  let map = texName && TEX[texName] ? TEX[texName] : null;
  if (map && m.texScale) {
    // 每米纹理密度：不同尺寸的面上砂粒/砖缝尺度应该一致
    map = map.clone();
    map.needsUpdate = true;
    map.repeat.set(map.repeat.x * m.texScale, map.repeat.y * m.texScale);
  }
  const params = {
    color: base,
    roughness: m.rough ?? 0.8,
    metalness: m.metal ?? 0.0,
    map: map || undefined,
    transparent: !!m.transparent,
    opacity: m.opacity ?? 1,
    side: m.side === 'double' ? THREE.DoubleSide : THREE.FrontSide,
  };
  if (map) params.color = base.clone().multiplyScalar(1.0);
  if (m.emissive) {
    params.emissive = col(m.emissive);
    params.emissiveIntensity = m.emissiveIntensity ?? 1;
    if (m.tex === 'sign') params.map = signTex(m);
  }
  if (texName === 'sign') params.map = signTex(m);
  const mat = new THREE.MeshStandardMaterial(params);
  if (m.flat) mat.flatShading = true;
  mat.userData.spec = m;

}
function signTex(m) {
  const key = 'sign:' + (m.text || '') + (m.bg || '') + (m.fg || '');
  if (TEX[key]) return TEX[key];
  const w = 512, h = 128;
  TEX[key] = canvasTex(w, h, (g) => {
    g.fillStyle = m.bg || '#2f6fd0'; g.fillRect(0, 0, w, h);
    g.fillStyle = m.fg || '#f2f6ff';
    g.font = `bold ${m.fontSize || 64}px "Microsoft YaHei","Noto Sans SC",sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(m.text || '', w / 2, h / 2 + 2);
  }, { repeat: [1, 1] });
  return TEX[key];
}

/* ---------- 几何 ---------- */
const SHAPES = {};
function applyTransform(obj, o) {
  const p = o.pos || [0, 0, 0], r = o.rot || [0, 0, 0], s = o.scale || [1, 1, 1];
  obj.position.set(p[0], p[1], p[2]);
  obj.rotation.set(r[0] * D2R, r[1] * D2R, r[2] * D2R);
  obj.scale.set(s[0], s[1], s[2]);
}
function meshOf(geo, o, mat) {
  const m = new THREE.Mesh(geo, mat);
  applyTransform(m, o);
  m.castShadow = o.shadow !== false;
  m.receiveShadow = o.receive !== false;
  m.userData.spec = o;
  return m;
}
function geoFor(o) {
  switch (o.kind) {
    case 'box': {
      const size = o.size || [1, 1, 1];
      const radius = Math.min(o.edgeRadius || 0, Math.min(...size) / 2);
      if (radius > 0) return new RoundedBoxGeometry(...size, 2, radius);
      return new THREE.BoxGeometry(...size);
    }
    case 'sphere': return new THREE.SphereGeometry(o.r ?? 0.5, o.seg ?? 24, (o.seg ?? 24) / 2);
    case 'cyl': return new THREE.CylinderGeometry(o.rTop ?? o.r ?? 0.5, o.rBot ?? o.r ?? 0.5,
      o.h ?? 1, o.seg ?? 24, 1, !!o.open);
    case 'leaf': {
      // The origin is the attachment point. Curved wide leaves and narrow blades share this mesh.
      const widths = o.blade ? [0.30, 0.42, 0.30, 0.16] : [0.28, 0.50, 0.48, 0.28];
      const vertices = [0, 0, 0], faces = [];
      for (let i = 0; i < widths.length; i++) {
        const y = (i + 1) / 5, w = widths[i], z = (o.blade ? 0.46 : 0.15) * y * y;
        vertices.push(-w, y, z, 0, y, z + 0.11 * w, w, y, z);
      }
      vertices.push(0, 1, o.blade ? 0.53 : 0.17);
      faces.push(0, 1, 2, 0, 2, 3);
      for (let r = 1; r < 10; r += 3) {
        faces.push(r, r+3, r+4, r, r+4, r+1, r+1, r+4, r+5, r+1, r+5, r+2);
      }
      faces.push(10, 13, 11, 11, 13, 12);
      const blade = new THREE.BufferGeometry();
      blade.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      blade.setIndex(faces);
      blade.computeVertexNormals();
      return blade;
    }
    case 'plane': return new THREE.PlaneGeometry(...(o.size || [1, 1]), o.wSeg ?? 1, o.hSeg ?? 1);
    case 'torus': return new THREE.TorusGeometry(o.r ?? 0.5, o.tube ?? 0.1, 12, o.seg ?? 48);
    case 'lathe': {
      const pts = (o.profile || [[0.5, 0], [0.5, 1]]).map(p => new THREE.Vector2(p[0], p[1]));
      return new THREE.LatheGeometry(pts, o.seg ?? 24);
    }
    case 'extrude': {
      const sh = new THREE.Shape();
      const pts = o.points || [[-0.5, -0.5], [0.5, -0.5], [0.5, 0.5], [-0.5, 0.5]];
      sh.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) sh.lineTo(pts[i][0], pts[i][1]);
      sh.closePath();
      return new THREE.ExtrudeGeometry(sh, { depth: o.depth ?? 0.2, bevelEnabled: !!o.bevel,
        bevelSize: o.bevelSize ?? 0.02, bevelThickness: o.bevelThickness ?? 0.02, bevelSegments: 2, curveSegments: 6 });

}
const foliageTime = { value: 0 };
function bendFoliage(mesh, spec) {
  const strength = Number(spec.wind.strength);
  if (!(strength > 0)) return;
  const direction = new THREE.Vector2(...(spec.wind.direction || [1, 0]));
  if (direction.lengthSq() === 0) return;
  direction.normalize();
  const tuning = new THREE.Vector3(direction.x, direction.y, Math.min(strength, 0.35));
  function wire(material) {
    material.customProgramCacheKey = () => 'space-foliage-wind';
    material.onBeforeCompile = (shader) => {
      shader.uniforms.uFoliageTime = foliageTime;
      shader.uniforms.uFoliageWind = { value: tuning };
      shader.vertexShader = 'uniform float uFoliageTime; uniform vec3 uFoliageWind;\n' + shader.vertexShader;
      shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', `
        #include <begin_vertex>
        vec3 anchor = (modelMatrix * instanceMatrix[3]).xyz;
        float phase = dot(anchor.xz, vec2(0.67, 0.94));
        float air = 0.55 + 0.29 * sin(uFoliageTime * 2.1 - phase)
                         + 0.16 * sin(uFoliageTime * 3.7 - phase * 2.0);
        vec3 wind = vec3(uFoliageWind.x, 0.0, uFoliageWind.y);
        mat3 basis = mat3(modelMatrix) * mat3(instanceMatrix);
        vec3 localWind = vec3(dot(wind, basis[0]) / dot(basis[0], basis[0]),
                             dot(wind, basis[1]) / dot(basis[1], basis[1]),
                             dot(wind, basis[2]) / dot(basis[2], basis[2]));
        transformed += localWind * (length(basis[1]) * uFoliageWind.z * air * position.y * position.y);
      `);
    };
  }
  mesh.customDepthMaterial = new THREE.MeshDepthMaterial({
    depthPacking: THREE.RGBADepthPacking, side: THREE.DoubleSide,
  });
  mesh.customDistanceMaterial = new THREE.MeshDistanceMaterial({ side: THREE.DoubleSide });
  wire(mesh.material);
  wire(mesh.customDepthMaterial);
  wire(mesh.customDistanceMaterial);
}
function buildObject(o, parent, out) {
  if (o.hidden) return null;                       // 因果测试用：同一场景里“拿走”一个物体
  if (o.kind === 'group') {
    const g = new THREE.Group();
    applyTransform(g, o);
    g.userData.spec = o;
    parent.add(g);
    (o.children || []).forEach(c => buildObject(c, g, out));
    return g;
  }
  if (o.kind === 'instanced') {
    const base = { ...o, kind: o.base || 'box' };
    // instanced 的尺寸以 size 为准：球体半径取 size[0]/2，避免出现 1 米大球
    if (base.kind === 'sphere' && o.r === undefined) base.r = (o.size && o.size[0] ? o.size[0] : 1) / 2;
    if (base.kind === 'cyl' && o.h === undefined) base.h = (o.size && o.size[1] ? o.size[1] : 1);
